services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      MAX_FILE_MB: "50"
      MAX_TOTAL_MB: "3072"
    volumes:
      - ./data/files:/data/files
      - ./service-account.json:/app/service-account.json:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./members.json:/app/members.json:ro
    mem_limit: 300m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/files:/data/files:ro
      - caddy_data:/data/caddy
    mem_limit: 150m

volumes:
  caddy_data:
